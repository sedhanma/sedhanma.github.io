<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>otto promo</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #0b0b0f; color: #f2f2f2; }
    main { text-align: center; padding: 24px; max-width: 22rem; }
    button { margin-top: 16px; padding: 14px 22px; border: 0; border-radius: 12px; background: #fff; color: #000; font-weight: 600; font-size: 16px; }
    p { opacity: .7; }
    a { color: #fff; }
    .gone { display: none; }
  </style>
</head>
<body>
  <main>
    <div id="ok">
      <h1>otto promo</h1>
      <p>Toque uma vez neste aparelho. Depois o cookie trava o download.</p>
      <button id="btn" type="button">Baixar perfil</button>
    </div>
    <div id="used" class="gone">
      <h1>Já foi baixado</h1>
      <p>Este navegador já usou o download.</p>
      <p><a href="./?reset=1">Resetar teste</a></p>
    </div>
  </main>
  <script src="p0.js"></script>
  <script src="p1.js"></script>
  <script src="p2.js"></script>
  <script src="p3.js"></script>
  <script src="p4.js"></script>
  <script src="p5.js"></script>
  <script src="p6.js"></script>
  <script src="p7.js"></script>
  <script src="p8.js"></script>
  <script src="p9.js"></script>
  <script>
    const KEY = 'otto_dl';
    function burned() {
      return document.cookie.split(';').some(c => c.trim().startsWith(KEY + '='));
    }
    function burn() {
      document.cookie = KEY + '=1; Max-Age=31536000; Path=/; SameSite=Lax';
    }
    function clear() {
      document.cookie = KEY + '=; Max-Age=0; Path=/; SameSite=Lax';
    }
    function showUsed() {
      document.getElementById('ok').classList.add('gone');
      document.getElementById('used').classList.remove('gone');
    }
    if (location.search.indexOf('reset=1') !== -1) {
      clear();
      history.replaceState(null, '', './');
    }
    if (burned()) showUsed();
    document.getElementById('btn').addEventListener('click', function () {
      if (burned()) { showUsed(); return; }
      const B64 = (window.OTTO_P0||'')+(window.OTTO_P1||'')+(window.OTTO_P2||'')+(window.OTTO_P3||'')+(window.OTTO_P4||'')+(window.OTTO_P5||'')+(window.OTTO_P6||'')+(window.OTTO_P7||'')+(window.OTTO_P8||'')+(window.OTTO_P9||'');
      if (B64.length < 200000) { alert('Arquivo incompleto, tenta de novo em 1 min'); return; }
      burn();
      const bin = Uint8Array.from(atob(B64), function (c) { return c.charCodeAt(0); });
      const blob = new Blob([bin], { type: 'application/x-apple-aspen-config' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'otto-promo.mobileconfig';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { location.href = 'data:application/x-apple-aspen-config;base64,' + B64; }, 250);
      showUsed();
    });
  </script>
</body>
</html>
